<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification TikTok</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .box { background: #f4f4f4; padding: 20px; border-radius: 8px; display: inline-block; max-width: 600px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Authentification en cours...</h1>
    <div class="box">
        <p>Copiez le code ci-dessous et coller-le dans votre terminal :</p>
        <h3 id="code-output">Chargement...</h3>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        const output = document.getElementById('code-output');
        if (code) {
            output.innerText = code;
            output.style.color = "green";
        } else if (error) {
            output.innerText = "Erreur : " + error;
            output.style.color = "red";
        } else {
            output.innerText = "Aucun code trouvé dans l'URL.";
        }
    </script>
</body>
</html>
